    location = /hub/api {
        return 301 /hub/api/;
    }

    # Dice Estate keeps its project credential on the Hub server. Its browser
    # calls this root API path, so do not let it fall through to the legacy
    # catch-all application upstream.
    location = /api/agent/decision {
        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
        client_max_body_size 64k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never publish ad-hoc rollback files from the Hub document root.
    location ~* ^/hub/(?:backups(?:/|$)|.*(?:\.bak(?:[.-].*)?|\.backup(?:[.-].*)?|\.old(?:[.-].*)?)) {
        return 404;
    }

    # Public clients may read the sanitized configuration. Configuration
    # writes reach the Hub so HUB_ADMIN_TOKEN can authorize them centrally.
    location = /hub/api/model-config {
        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hub;
    }

    # The retired credential endpoint remains blocked at the public boundary;
    # the application also returns 410 if it is reached locally.
    location = /hub/api/integrations/coze {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hub;
    }

    location /hub/api/ {
        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
