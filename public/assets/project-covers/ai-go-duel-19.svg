<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <pattern id="page-grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#755434" stroke-opacity="0.34" stroke-width="1"/>
    </pattern>
    <pattern id="go-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4f321d" stroke-width="2"/>
    </pattern>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c17d"/>
      <stop offset="1" stop-color="#d9a85b"/>
    </linearGradient>
    <radialGradient id="black-stone" cx="34%" cy="27%" r="72%">
      <stop offset="0" stop-color="#4c524e"/>
      <stop offset="0.65" stop-color="#171b19"/>
      <stop offset="1" stop-color="#090b0a"/>
    </radialGradient>
    <radialGradient id="white-stone" cx="34%" cy="27%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f4efe4"/>
      <stop offset="1" stop-color="#d8d0c0"/>
    </radialGradient>
    <filter id="stone-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#2d1d11" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1672" height="941" fill="#e9e3d5"/>
  <rect width="1672" height="941" fill="url(#page-grid)"/>

  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" fill="#191d1a">
    <text x="108" y="178" font-size="62" font-weight="800">AI · 围棋 19 路</text>
    <text x="108" y="238" font-size="30" font-weight="500" fill="#176b5f">19×19 STANDARD GO</text>
    <rect x="108" y="267" width="390" height="5" rx="2.5" fill="#176b5f"/>

    <g transform="translate(108 648)">
      <rect width="420" height="142" rx="24" fill="#fbfaf5" stroke="#176b5f" stroke-width="2"/>
      <text x="32" y="62" font-size="34" font-weight="750">提子 · 禁自杀 · 打劫</text>
      <text x="32" y="106" font-size="26" fill="#176b5f">AI 讲解每一步棋</text>
    </g>
  </g>

  <g>
    <rect x="718" y="94" width="748" height="748" rx="42" fill="url(#board)" stroke="#674323" stroke-width="4"/>
    <rect x="804" y="180" width="576" height="576" fill="url(#go-grid)" stroke="#4f321d" stroke-width="2"/>

    <g fill="#50331e">
      <circle cx="900" cy="276" r="6"/><circle cx="1092" cy="276" r="6"/><circle cx="1284" cy="276" r="6"/>
      <circle cx="900" cy="468" r="6"/><circle cx="1092" cy="468" r="6"/><circle cx="1284" cy="468" r="6"/>
      <circle cx="900" cy="660" r="6"/><circle cx="1092" cy="660" r="6"/><circle cx="1284" cy="660" r="6"/>
    </g>

    <g filter="url(#stone-shadow)">
      <circle cx="932" cy="340" r="27" fill="url(#black-stone)" stroke="#080a09" stroke-width="2"/>
      <circle cx="1188" cy="372" r="27" fill="url(#white-stone)" stroke="#655f55" stroke-width="2"/>
      <circle cx="1252" cy="564" r="27" fill="url(#black-stone)" stroke="#080a09" stroke-width="2"/>
      <circle cx="996" cy="596" r="27" fill="url(#white-stone)" stroke="#655f55" stroke-width="2"/>
    </g>
  </g>
</svg>
