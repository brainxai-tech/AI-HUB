<!doctype html>
<html lang="zh-CN" >
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>栖声 - AI 恋爱陪伴</title>
    <link rel="stylesheet" href="./styles.css?v=20260617-model-providers" />
    <link rel="stylesheet" href="/hub/suite-theme.css?v=20260628-suite2" />
  </head>
  <body >
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="会话列表">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">栖</div>
          <div>
            <h1>栖声</h1>
            <p>AI 恋爱陪伴</p>
          </div>
        </div>

        <button id="newConversationButton" class="primary-button full-width" type="button">新对话</button>

        <div class="sidebar-section">
          <div class="section-label">最近会话</div>
          <div id="conversationList" class="conversation-list" role="list"></div>
        </div>

        <div class="connection-card" id="connectionCard" hidden>
          <div>
            <div class="section-label">服务状态</div>
            <div id="connectionText" class="connection-text">等待确认</div>
          </div>
          <button id="disconnectButton" class="secondary-button compact" type="button" hidden>退出</button>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div class="companion-avatar" id="companionAvatar" aria-hidden="true">年</div>
          <div class="chat-title-block">
            <h2 id="chatTitle">温柔年上</h2>
            <p id="chatSubtitle">先确认 18+ 后进入。</p>
          </div>
          <div class="header-actions">
            <button id="clearConversationButton" class="ghost-button" type="button">清空</button>
            <button id="toggleSettingsButton" class="secondary-button compact" type="button">设置</button>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite" aria-label="聊天消息"></section>

        <section id="safetyCard" class="safety-card" hidden>
          <strong>需要现实支持</strong>
          <p>如果你或他人正处于立即危险中，请联系当地紧急服务。美国用户可以拨打或短信 988。</p>
        </section>

        <form id="messageForm" class="composer" autocomplete="off">
          <label class="sr-only" for="messageInput">输入消息</label>
          <textarea id="messageInput" rows="1" placeholder="先确认 18+ 后进入..." disabled></textarea>
          <button id="stopButton" class="secondary-button icon-button" type="button" hidden aria-label="停止生成">停</button>
          <button id="sendButton" class="primary-button send-button" type="submit" disabled>发送</button>
        </form>
      </main>

      <aside id="settingsPanel" class="settings-panel" aria-label="设置">
        <div class="settings-header">
          <h2>设置</h2>
          <button id="closeSettingsButton" class="ghost-button compact" type="button">关闭</button>
        </div>

        <section class="settings-section">
          <h3>角色</h3>
          <div id="characterList" class="character-list" role="radiogroup" aria-label="恋爱角色"></div>
        </section>

        <section class="settings-section">
          <h3>关系</h3>
          <div class="relationship-card">
            <div>
              <div class="section-label">当前阶段</div>
              <strong id="relationshipStage">初识</strong>
            </div>
            <div id="relationshipMeter" class="relationship-meter" aria-hidden="true">
              <span></span>
            </div>
          </div>
        </section>

        <section class="settings-section">
          <h3>今日事件</h3>
          <div class="daily-event">
            <strong id="dailyEventTitle">晚安电话</strong>
            <p id="dailyEventBody">让关系从一句轻声晚安开始。</p>
            <button id="startDailyEventButton" class="secondary-button full-width" type="button">开始这个事件</button>
          </div>
        </section>

        <section class="settings-section" hidden>
          <h3>自动方式</h3>
          <label class="field">
            <span>自动来源</span>
            <select id="providerSelect"></select>
          </label>
          <label class="field">
            <span>自动方式</span>
            <select id="modelSelect">
            </select>
          </label>
          <p class="hint">聊天会自动准备，不需要在这里配置。</p>
        </section>

        <section class="settings-section">
          <h3>回复温度</h3>
          <label class="range-field" for="temperatureRange" aria-label="回复温度，左侧更稳定，右侧更松弛">
            <span>稳</span>
            <input id="temperatureRange" type="range" min="0.2" max="1" step="0.05" value="0.72" aria-label="回复温度" />
            <span>松</span>
          </label>
        </section>

        <section class="settings-section">
          <div class="section-row">
            <h3>记忆</h3>
            <button id="clearMemoriesButton" class="ghost-button compact" type="button">清空</button>
          </div>
          <div id="memoryList" class="memory-list"></div>
        </section>

        <section class="settings-section">
          <div class="section-row">
            <h3>内测记录</h3>
            <button id="exportBetaDataButton" class="secondary-button compact" type="button">导出</button>
          </div>
          <div id="betaSummary" class="metric-grid" aria-label="内测数据摘要"></div>
          <button id="clearBetaDataButton" class="ghost-button compact" type="button">清空内测记录</button>
        </section>

        <section class="settings-section">
          <h3>反馈</h3>
          <div id="feedbackList" class="insight-list"></div>
        </section>

        <section class="settings-section">
          <h3>风险日志</h3>
          <div id="riskLogList" class="insight-list"></div>
        </section>

        <section class="settings-section">
          <h3>隐私与边界</h3>
          <p class="hint">角色是 AI，不是真人；记忆和聊天记录只保存在这个浏览器里。</p>
          <button id="clearLocalDataButton" class="danger-button full-width" type="button">清空本地数据</button>
        </section>
      </aside>

      <section id="keyGate" class="key-gate" aria-labelledby="keyGateTitle">
        <form id="keyForm" class="key-panel">
          <div class="key-panel-header">
            <div class="brand-mark large" aria-hidden="true">栖</div>
            <div>
              <h2 id="keyGateTitle">进入栖声</h2>
          <p>18+ AI 恋爱陪伴。确认年龄后即可进入。</p>
            </div>
          </div>

          <label class="check-field" for="ageConfirmInput">
            <input id="ageConfirmInput" type="checkbox" aria-label="确认已满 18 岁并知晓聊天对象是 AI 角色" />
            <span>我已满 18 岁，并知道聊天对象是 AI 角色，不是真人。</span>
          </label>

          <label class="field" hidden>
            <span>自动来源</span>
            <select id="gateProviderSelect"></select>
          </label>

          <label class="field" hidden>
            <span>自动方式</span>
            <select id="gateModelSelect">
            </select>
          </label>

          <button id="connectButton" class="primary-button full-width" type="submit">确认并进入</button>
          <p id="keyGateMessage" class="form-message" role="status"></p>
        </form>
      </section>
    </div>

    <script src="./app.js?v=20260628-no-project-api-ui" type="module"></script>
    <script defer src="/hub/suite-shell.js?v=20260628-suite2" data-suite-project="AI · 栖声陪伴" data-suite-hub="/hub/"></script>
  </body>
</html>
